{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">REGISTRO</p><h1>{{ 'Editar gasto' if record else 'Nuevo gasto' }}</h1><p>Los gastos se descuentan del ingreso diario y no se incluyen en las comisiones.</p></div><form method="post" class="panel form-panel"><div class="row g-4"><div class="col-md-6"><label class="form-label">Fecha</label><input type="date" name="expense_date" value="{{ request.form.expense_date or (record.expense_date if record else '') }}" class="form-control" required></div><div class="col-md-6"><label class="form-label">Monto del gasto (US$)</label><input name="amount" value="{{ request.form.amount or (record.amount if record else '') }}" type="number" min="0.01" step="0.01" class="form-control" required></div><div class="col-12"><label class="form-label">¿A qué corresponde el gasto?</label><input name="description" value="{{ request.form.description or (record.description if record else '') }}" class="form-control" placeholder="Ej. Compra de aceite y filtros" required></div><div class="col-12"><label class="form-label">Observaciones</label><input name="observations" value="{{ request.form.observations or (record.observations if record else '') }}" class="form-control"></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-danger px-4">{{ 'Guardar cambios' if record else 'Guardar gasto' }}</button><a class="btn btn-light" href="{{ url_for('reports') if record else url_for('dashboard') }}">Cancelar</a></div></form>{% endblock %}{% block scripts %}<script>document.querySelector('[name=expense_date]').value ||= new Date().toISOString().slice(0,10);</script>{% endblock %}
