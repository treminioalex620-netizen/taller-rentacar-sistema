{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">REGISTRO</p><h1>{{'Editar gasto' if record else 'Nuevo gasto'}}</h1></div><form method="post" class="panel form-panel"><div class="row g-3"><div class="col-md-4"><label>Fecha</label><input required type="date" name="expense_date" value="{{request.form.expense_date or (record.expense_date if record else '')}}" class="form-control"></div><div class="col-md-4"><label>Monto</label><input required type="number" min=".01" step=".01" name="amount" value="{{request.form.amount or (record.amount if record else '')}}" class="form-control"></div><div class="col-md-4"><label>Categoría</label><select name="category" class="form-select">{% for c in ['Repuestos','Combustible','Insumos','Salarios','Otros'] %}<option {{'selected' if record and record.category==c}}>{{c}}</option>{% endfor %}</select></div><div class="col-12"><label>Descripción</label><input required name="description" value="{{request.form.description or (record.description if record else '')}}" class="form-control"></div><div class="col-12"><label>Observaciones</label><input name="observations" value="{{request.form.observations or (record.observations if record else '')}}" class="form-control"></div></div><button class="btn btn-danger mt-4">Guardar gasto</button></form>{% endblock %}{% block scripts %}<script>document.querySelector('[name=expense_date]').value||=new Date().toISOString().slice(0,10)</script>{% endblock %}
