{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">RENTACAR</p><h1>Clientes</h1></div><div class="row g-4"><div class="col-lg-4"><form method="post" class="panel"><label>Nombre</label><input required name="name" class="form-control mb-2"><label>Teléfono</label><input name="phone" class="form-control mb-2"><label>Documento</label><input name="document_id" class="form-control mb-2"><label>Dirección</label><input name="address" class="form-control mb-2"><label>Notas</label><textarea name="notes" class="form-control mb-3"></textarea><button class="btn btn-primary w-100">Guardar cliente</button></form></div><div class="col-lg-8"><section class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Cliente</th><th>Teléfono</th><th>Documento</th></tr></thead><tbody>{% for r in records %}<tr><td>{{r.name}}</td><td>{{r.phone or '—'}}</td><td>{{r.document_id or '—'}}</td></tr>{% else %}<tr><td colspan="3">Sin clientes.</td></tr>{% endfor %}</tbody></table></div></section></div></div>{% endblock %}
