{% extends 'base.html' %}
{% block title %}Iniciar sesión · Marvin Motors{% endblock %}
{% block content %}
<style>
  body:has(.marvin-login){background:#032761}.login-page{min-height:100vh;padding:0!important;max-width:none!important}.marvin-login{min-height:100vh;display:grid;grid-template-columns:46% 54%;background:radial-gradient(circle at 85% 30%,#0c6ed4 0,#063b83 32%,#031d4c 100%);overflow:hidden}.login-showcase{position:relative;overflow:hidden;background:linear-gradient(90deg,#00173624,#003d8235),url("{{ url_for('static', filename='img/marvin-motors-workshop-login.png') }}") center/cover no-repeat}.login-side{display:grid;place-items:center;padding:42px;position:relative}.login-side:before{content:"";position:absolute;width:280px;height:280px;border:32px solid #0f6fd0;border-radius:50%;right:-100px;top:-116px;opacity:.35}.marvin-login-card{position:relative;width:min(100%,710px);background:linear-gradient(145deg,#fff,#edf5ff);padding:50px 68px;border-radius:42px;box-shadow:0 24px 55px #00174285;text-align:center}.login-logo{width:min(100%,420px);height:105px;object-fit:cover;border-radius:8px;margin:0 auto 22px;display:block}.marvin-login-card h1{font-size:2.35rem;font-weight:850;color:#061d4c;margin:.25rem 0}.marvin-login-card p{font-size:1.1rem;color:#637087}.login-field{position:relative;text-align:left;margin:18px 0}.login-field .field-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:1.35rem;z-index:1}.login-field input{height:66px;border:2px solid #b5c4d9;border-radius:20px;padding:0 18px 0 58px;font-size:1.08rem;background:#fff}.login-field input:focus{border-color:#0b70d0;box-shadow:0 0 0 .2rem #0972d52c}.login-options{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 28px;color:#052b70}.login-options a{color:#075ec1;text-decoration:none;font-weight:650}.marvin-login-card .btn{height:72px;border-radius:20px;font-size:1.32rem;background:linear-gradient(110deg,#062e77,#0875df);border:0;box-shadow:0 12px 24px #0752a749}@media(max-width:900px){.marvin-login{grid-template-columns:1fr}.login-showcase{display:none}.login-side{padding:28px 18px}.marvin-login-card{padding:38px 28px;border-radius:28px}.login-logo{height:82px}.marvin-login-card h1{font-size:2rem}}@media(max-width:460px){.marvin-login-card{padding:30px 20px}.login-logo{height:65px}.login-options{font-size:.85rem}.marvin-login-card .btn{height:62px}}
</style>
<div class="marvin-login"><aside class="login-showcase"></aside><section class="login-side"><div class="marvin-login-card"><img class="login-logo" src="{{ url_for('static', filename='img/marvin-motors-logo.png') }}" alt="Marvin Motors Taller y Rentacar"><h1>Bienvenido</h1><p>Inicia sesión para acceder al sistema</p><form method="post" class="mt-4"><div class="login-field"><span class="field-icon">👤</span><input name="username" class="form-control" placeholder="Usuario" required autofocus></div><div class="login-field"><span class="field-icon">🔒</span><input name="password" type="password" class="form-control" placeholder="Contraseña" required></div><div class="login-options"><label class="d-flex align-items-center gap-2"><input checked type="checkbox" class="form-check-input m-0"> Recordarme</label><a href="#" onclick="return false">¿Olvidaste tu contraseña?</a></div><button class="btn btn-primary w-100">↪ &nbsp; Iniciar sesión</button></form></div></section></div>
{% endblock %}
