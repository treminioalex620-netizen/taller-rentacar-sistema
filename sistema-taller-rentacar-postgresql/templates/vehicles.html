{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">RENTACAR</p><h1>Vehículos</h1></div><div class="row g-4"><div class="col-lg-4"><form method="post" class="panel"><label>Placa</label><input required name="plate" class="form-control mb-2"><label>Marca</label><input required name="brand" class="form-control mb-2"><label>Modelo</label><input required name="model" class="form-control mb-2"><div class="row"><div class="col"><label>Año</label><input name="year" type="number" class="form-control mb-2"></div><div class="col"><label>Color</label><input name="color" class="form-control mb-2"></div></div><label>Precio diario</label><input name="daily_rate" type="number" step=".01" class="form-control mb-2"><label>Notas</label><textarea name="notes" class="form-control mb-3"></textarea><button class="btn btn-primary w-100">Guardar vehículo</button></form></div><div class="col-lg-8"><section class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Placa</th><th>Vehículo</th><th>Precio/día</th><th>Estado</th></tr></thead><tbody>{% for r in records %}<tr><td>{{r.plate}}</td><td>{{r.brand}} {{r.model}} {{r.year or ''}}</td><td>${{'%.2f'|format(r.daily_rate or 0)}}</td><td>{{r.status|title}}</td></tr>{% else %}<tr><td colspan="4">Sin vehículos.</td></tr>{% endfor %}</tbody></table></div></section></div></div>{% endblock %}
