{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">RENTACAR</p><h1>Editar reserva</h1></div><form method="post" class="panel reservation-form" style="max-width:900px"><div class="row g-3"><div class="col-md-4"><label>Fecha de registro</label><input required type="date" name="reservation_date" value="{{record.reservation_date}}" class="form-control"></div><div class="col-md-4"><label>Desde</label><input required type="date" name="start_date" value="{{record.start_date}}" class="form-control"></div><div class="col-md-4"><label>Hasta</label><input required type="date" name="end_date" value="{{record.end_date}}" class="form-control"></div><div class="col-md-6"><label>Cliente</label><select required name="client_id" class="form-select">{% for c in clients %}<option value="{{c.id}}" {{'selected' if c.id==record.client_id}}>{{c.name}}</option>{% endfor %}</select></div><div class="col-md-6"><label>Teléfono</label><input name="phone" value="{{record.phone or ''}}" class="form-control"></div><div class="col-md-6"><label>Vehículo</label><select name="vehicle_id" class="form-select"><option value="">Sin asignar</option>{% for v in vehicles %}<option value="{{v.id}}" {{'selected' if v.id==record.vehicle_id}}>{{v.plate}} — {{v.brand}} {{v.model}}</option>{% endfor %}</select></div><div class="col-md-6"><label>Carpeta</label><select name="folder_id" class="form-select"><option value="">Sin carpeta</option>{% for f in folders %}<option value="{{f.id}}" {{'selected' if f.id==record.folder_id}}>{{f.name}}</option>{% endfor %}</select></div><div class="col-md-6"><label>Concepto</label><input required name="concept" value="{{record.concept}}" class="form-control"></div><div class="col-md-2"><label>Días</label><input required min="1" type="number" name="days_total" value="{{record.days_total}}" class="form-control"></div><div class="col-md-2"><label>Total $</label><input required min="0" step=".01" type="number" name="total_amount" value="{{record.total_amount}}" class="form-control"></div><div class="col-md-2"><label>Abono $</label><input required min="0" step=".01" type="number" name="deposit" value="{{record.deposit}}" class="form-control"></div><div class="col-12"><label>Observaciones</label><textarea name="notes" class="form-control">{{record.notes or ''}}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Guardar cambios</button><a class="btn btn-light ms-2" href="{{url_for('reservations')}}">Cancelar</a></div></form>{% endblock %}
