{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">SEGURIDAD</p><h1>Cambiar contraseña</h1><p>Use una contraseña personal de al menos 6 caracteres.</p></div><form method="post" class="panel form-panel"><label class="form-label">Contraseña actual</label><input name="current_password" type="password" class="form-control mb-3" required><label class="form-label">Nueva contraseña</label><input name="new_password" type="password" minlength="6" class="form-control mb-3" required><label class="form-label">Confirmar nueva contraseña</label><input name="confirm_password" type="password" minlength="6" class="form-control mb-4" required><button class="btn btn-primary">Actualizar contraseña</button></form>{% endblock %}
