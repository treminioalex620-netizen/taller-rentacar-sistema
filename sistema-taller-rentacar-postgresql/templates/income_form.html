{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">REGISTRO</p><h1>{{ 'Editar ingreso' if record else 'Nuevo ingreso' }}</h1><p>Seleccione el área: las rentas y los trabajos se mantienen separados.</p></div><form method="post" class="panel form-panel"><div class="row g-4"><div class="col-md-6"><label class="form-label">Tipo de ingreso</label><select name="category" id="category" class="form-select" required><option value="renta" {{ 'selected' if record and record.category == 'renta' }}>Renta de vehículo</option><option value="taller" {{ 'selected' if record and record.category == 'taller' }}>Trabajo del taller</option></select></div><div class="col-md-6"><label class="form-label">Fecha</label><input type="date" name="income_date" value="{{ request.form.income_date or (record.income_date if record else '') }}" class="form-control" required></div><div class="col-12"><label class="form-label" id="description-label">¿A qué corresponde la renta?</label><input name="description" value="{{ request.form.description or (record.description if record else '') }}" class="form-control" placeholder="Ej. Renta de vehículo Toyota Hilux" required></div><div class="col-md-6"><label class="form-label">Monto cobrado (US$)</label><input name="amount" value="{{ request.form.amount or (record.amount if record else '') }}" type="number" min="0.01" step="0.01" class="form-control" required></div><div class="col-md-6"><label class="form-label" id="observations-label">Observaciones (días de renta)</label><input name="observations" value="{{ request.form.observations or (record.observations if record else '') }}" class="form-control" placeholder="Ej. 3 días"></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary px-4">{{ 'Guardar cambios' if record else 'Guardar ingreso' }}</button><a class="btn btn-light" href="{{ url_for('reports') if record else url_for('dashboard') }}">Cancelar</a></div></form>{% endblock %}{% block scripts %}<script>const c=document.querySelector('#category'),d=document.querySelector('#description-label'),o=document.querySelector('#observations-label');function setLabels(){const work=c.value==='taller';d.textContent=work?'¿Qué trabajo se realizó?':'¿A qué corresponde la renta?';o.textContent=work?'Observaciones':'Observaciones (días de renta)'}c.addEventListener('change',setLabels);setLabels();document.querySelector('[name=income_date]').value ||= new Date().toISOString().slice(0,10);</script>{% endblock %}
