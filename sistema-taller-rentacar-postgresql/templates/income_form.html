{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">REGISTRO</p><h1>{{'Editar ingreso' if record else 'Nuevo ingreso'}}</h1><p>Solo los trabajos de taller generan comisión.</p></div><form method="post" class="panel form-panel"><div class="row g-3"><div class="col-md-6"><label>Tipo</label><select name="category" id="category" class="form-select"><option value="renta" {{'selected' if record and record.category=='renta'}}>Renta de vehículo</option><option value="taller" {{'selected' if record and record.category=='taller'}}>Trabajo del taller</option><option value="lavado" {{'selected' if record and record.category=='lavado'}}>Lavado de vehículo</option></select></div><div class="col-md-6"><label>Fecha de cobro</label><input required type="date" name="income_date" value="{{request.form.income_date or (record.income_date if record else '')}}" class="form-control"></div><div id="rental-dates" class="row g-3 mx-0 px-0"><div class="col-md-6"><label>Renta desde</label><input type="date" name="rental_start" value="{{request.form.rental_start or (record.rental_start if record and record.rental_start else '')}}" class="form-control"></div><div class="col-md-6"><label>Renta hasta</label><input type="date" name="rental_end" value="{{request.form.rental_end or (record.rental_end if record and record.rental_end else '')}}" class="form-control"></div></div><div class="col-12"><label>Descripción</label><input required name="description" value="{{request.form.description or (record.description if record else '')}}" class="form-control"></div><div class="col-md-6"><label>Monto (US$)</label><input required type="number" min=".01" step=".01" name="amount" value="{{request.form.amount or (record.amount if record else '')}}" class="form-control"></div><div class="col-md-6"><label>Observaciones</label><input name="observations" value="{{request.form.observations or (record.observations if record else '')}}" class="form-control"></div></div><button class="btn btn-primary mt-4">Guardar ingreso</button></form>{% endblock %}{% block scripts %}<script>const c=document.querySelector('#category'),box=document.querySelector('#rental-dates'),fields=box.querySelectorAll('input');function rental(){let on=c.value==='renta';box.style.display=on?'flex':'none';fields.forEach(x=>x.required=on)}c.addEventListener('change',rental);rental();document.querySelector('[name=income_date]').value||=new Date().toISOString().slice(0,10)</script>{% endblock %}
