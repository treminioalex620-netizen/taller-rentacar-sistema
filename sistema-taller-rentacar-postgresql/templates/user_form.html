{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Editar usuario</h1><p>Deje la contraseña vacía para conservar la actual.</p></div><form method="post" class="panel form-panel"><div class="row g-3"><div class="col-md-6"><label>Usuario</label><input required name="username" value="{{record.username}}" class="form-control"></div><div class="col-md-6"><label>Rol</label><select name="role" class="form-select"><option value="user" {{'selected' if record.role=='user'}}>Usuario normal</option><option value="admin" {{'selected' if record.role=='admin'}}>Administrador</option></select></div><div class="col-12"><label>Nueva contraseña (opcional)</label><input name="password" type="password" minlength="6" class="form-control" placeholder="Dejar vacío para no cambiar"></div></div><div class="mt-4"><button class="btn btn-primary">Guardar cambios</button> <a href="{{url_for('users')}}" class="btn btn-light">Cancelar</a></div></form>{% endblock %}
