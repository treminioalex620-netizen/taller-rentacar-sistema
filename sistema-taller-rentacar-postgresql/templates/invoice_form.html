{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Editar factura</h1></div><form method="post" class="panel form-panel" style="max-width:720px"><div class="row g-3"><div class="col-12"><label>Descripción</label><input required name="description" value="{{record.description}}" class="form-control"></div><div class="col-md-6"><label>Monto</label><input required type="number" min=".01" step=".01" name="amount" value="{{record.amount}}" class="form-control"></div><div class="col-md-6"><label>Fecha</label><input required type="date" name="paid_date" value="{{record.paid_date}}" class="form-control"></div><div class="col-12"><label>Carpeta</label><select name="folder_id" class="form-select"><option value="">Sin carpeta</option>{% for folder in folders %}<option value="{{folder.id}}" {{'selected' if folder.id==record.folder_id}}>{{folder.name}}</option>{% endfor %}</select></div><div class="col-12"><label>Notas</label><textarea name="notes" class="form-control">{{record.notes or ''}}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Guardar cambios</button><a class="btn btn-light ms-2" href="{{url_for('invoices')}}">Cancelar</a></div></form>{% endblock %}
